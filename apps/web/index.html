<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#16352f" />
    <meta name="description" content="رزرو میز، آمار بازیکن و میزبانی نشست در رکاد." />
    <link rel="icon" href="/assets/brand/icon-navy.png" />
    <title>رکاد — باشگاه بازی</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem('rokad-theme') || 'system';
          var dark =
            t === 'dark' ||
            (t !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
