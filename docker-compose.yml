services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: rokad
      POSTGRES_PASSWORD: rokad
      POSTGRES_DB: rokad
    ports:
      - "5432:5432"
    volumes:
      - gk_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rokad"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  gk_pg:
